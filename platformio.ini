; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:01_Test_SX1262]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
build_src_filter = +<01_Test_SX1262/*>
lib_deps = 
    jgromes/RadioLib
build_unflags = -std=gnu++11
build_flags = -std=gnu++17


[env:02_sensor-node]
platform = espressif32
board = featheresp32
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder 
build_src_filter = +<02_sensor-node/*>
lib_deps = 
    jgromes/RadioLib
    adafruit/Adafruit BME680 Library
build_unflags = -std=gnu++11
build_flags = -std=gnu++17


[env:04_sensor-node-heltec]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder 
build_src_filter = +<02_sensor-node/*>
lib_deps = 
    jgromes/RadioLib
    adafruit/Adafruit BME680 Library
build_unflags = -std=gnu++11
build_flags = 
        -std=gnu++17
        -DHELTEC_V3_USED


[env:03_master_node]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
upload_speed = 921600
monitor_speed = 115200
monitor_filters = esp32_exception_decoder 
build_src_filter = +<03_master_node/*>
lib_deps = 
    jgromes/RadioLib
    bblanchon/ArduinoJson
    arduino-libraries/ArduinoHttpClient
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -DHELTEC_V3_USED

[env:05_master_node_heltec_V4]
platform = espressif32
board = heltec_wifi_lora_32_V4
framework = arduino
board_build.variants_dir = variants
board_build.variant = heltec_V4
monitor_speed = 115200  
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder 
build_src_filter = +<03_master_node/*>
lib_deps = 
    jgromes/RadioLib
    bblanchon/ArduinoJson
    arduino-libraries/ArduinoHttpClient
build_unflags = -std=gnu++11
build_flags = 
    -std=gnu++17
    -DHELTEC_V3_USED